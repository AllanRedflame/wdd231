<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacific Pathfinders | Home page</title>
    <meta name="author" content="David Poulsen">
    <meta name="description" content="Form page for Pacific Pathfinders.">

    <link href="styles/large.css" rel="stylesheet">
    <link href="styles/small.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <script src="scripts/toggle.js" defer></script>
    <script src="scripts/form.js" defer></script>
    
</head>
<body>
    <header>
        <img src="images/seattle-travel-logo.webp" alt="company logo">
        <span>Pacific Pathfinding</span>

        <button id="nav-toggle" aria-expanded="false" aria-controls="nav-menu">&#9776;</button>

        <nav id="nav-menu">
            <a href="index.html">Home</a>      
            <a href="discover.html">Discover</a>
            <a href="form.html" id="form-a">Form</a>
        </nav>

    </header>

<main>

<div id="join-main">

        <div id="inputs">
            <h1>Create an Account</h1>
            <form id="my-form" action="thankyou.html" method="get">

                <div id="first-name-box" class="input-box">
                    <label for="first-name">First Name</label>
                    <input id="first-name" type="text" name="first-name" required autocomplete="given-name" title="Enter your first name">
                </div>

                <div id="last-name-box" class="input-box">
                    <label for="last-name">Last Name</label>
                    <input id="last-name" type="text" name="last-name" required autocomplete="family-name" title="Enter your last name">
                </div>

                <div class="input-box">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="example@email.com" name="email-box" title="Enter your email" autocomplete="email" required>
                </div>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required>

                <button type="submit" id="submit-button">Create Account</button>

            </form>
        </div>
    </div>
</main>

    <footer>
        <div id="footer-contact-info">
            <b>Pacific Pathfinders</b>
            <p>400 Broad St, Seattle, WA 98109</p>
            <p>Pacificp@fastmail.net</p>
            <p>801-123-1234</p>
        </div>

        <div id="social-div">
                <p>Social media</p>
                <a href="https://github.com/AllanRedflame/wdd231"><img src="../images/github.svg" alt="github" id="github-icon"></a>
                <a href="https://www.linkedin.com/feed"><img src="../images/linkedin.svg" alt="linkedin" id="linkedin-icon"></a>
                <a href="https://x.com/"><img src="../images/xwebsite.svg" alt="x" id="x-icon"></a>
                <a href="https://www.facebook.com"><img src="../images/facebook.svg" alt="facebook" id="facebook-icon"></a>
        </div>

        <div id="copyright">
            <p>Copyright 2026</p>
            <a href="#">Video</a>
            <p>WDD231 Final | David Poulsen</p>
        </div>

    </footer>
</body>
</html>
